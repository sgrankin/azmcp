[workspace]
members = [
    "crates/azmcp",
    "crates/azmcp-core",
    "crates/azmcp-routegen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
deno_core = { version = "=0.410.0", features = ["include_icu_data"] }
futures-util = "0.3.31"
getrandom = "0.4.3"
libc = "0.2.177"
rmcp = { version = "=3.0.1", features = ["server", "transport-io"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
